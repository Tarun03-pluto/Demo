<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in</title>
<style>
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --text: #16202e;
  --muted: #5d6b7e;
  --border: #cdd5df;
  --accent: #2456d6;
  --accent-text: #ffffff;
  --error: #b42318;
  --success: #17692f;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1520; --surface: #18202e; --text: #e8edf4; --muted: #9aa8bb;
    --border: #334055; --accent: #6b93ff; --accent-text: #0b1220;
    --error: #ff8a80; --success: #6fd58a;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1520; --surface: #18202e; --text: #e8edf4; --muted: #9aa8bb;
  --border: #334055; --accent: #6b93ff; --accent-text: #0b1220;
  --error: #ff8a80; --success: #6fd58a;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; align-items: center; justify-content: center;
  padding: 1rem;
}
.card {
  width: 100%; max-width: 380px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 2rem 1.75rem;
}
h1 { font-size: 1.5rem; margin: 0 0 .25rem; font-weight: 650; }
.sub { margin: 0 0 1.5rem; color: var(--muted); font-size: .95rem; }
.field { margin-bottom: 1.1rem; }
label { display: block; font-size: .875rem; font-weight: 550; margin-bottom: .35rem; }
.input-wrap { position: relative; }
input {
  width: 100%; font: inherit; color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border); border-radius: 8px;
  padding: .7rem .8rem;
}
input:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
input[aria-invalid="true"] { border-color: var(--error); }
#password { padding-right: 4.2rem; }
.toggle {
  position: absolute; right: .4rem; top: 50%; transform: translateY(-50%);
  background: none; border: 0; color: var(--accent);
  font: inherit; font-size: .85rem; font-weight: 550;
  padding: .35rem .5rem; cursor: pointer; border-radius: 6px;
}
.error { color: var(--error); font-size: .825rem; margin: .35rem 0 0; min-height: 1.1em; }
.submit {
  width: 100%; font: inherit; font-weight: 600;
  background: var(--accent); color: var(--accent-text);
  border: 0; border-radius: 8px; padding: .8rem; cursor: pointer;
  margin-top: .25rem;
}
.submit:disabled { opacity: .6; cursor: progress; }
.status { margin: 1rem 0 0; font-size: .9rem; text-align: center; min-height: 1.2em; }
.status.ok { color: var(--success); }
.status.bad { color: var(--error); }
</style>
</head>
<body>
<main class="card">
  <h1>Welcome back</h1>
  <p class="sub">Log in to your account.</p>

  <div id="login" role="group" aria-label="Log in">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" aria-describedby="email-err">
      <p class="error" id="email-err" role="alert"></p>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input id="password" type="password" autocomplete="current-password" placeholder="At least 8 characters" aria-describedby="pw-err">
        <button type="button" class="toggle" id="toggle" aria-label="Show password" aria-pressed="false">Show</button>
      </div>
      <p class="error" id="pw-err" role="alert"></p>
    </div>

    <button type="button" class="submit" id="submit">Log in</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>
</main>

<script>
(function () {
  var email = document.getElementById("email");
  var pw = document.getElementById("password");
  var emailErr = document.getElementById("email-err");
  var pwErr = document.getElementById("pw-err");
  var status = document.getElementById("status");
  var submit = document.getElementById("submit");
  var toggle = document.getElementById("toggle");
  var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

  function setError(input, el, msg) {
    el.textContent = msg;
    input.setAttribute("aria-invalid", msg ? "true" : "false");
    return !msg;
  }

  function checkEmail() {
    var v = email.value.trim();
    if (!v) return setError(email, emailErr, "Enter your email address.");
    if (!EMAIL_RE.test(v)) return setError(email, emailErr, "Enter a valid email, like name@example.com.");
    return setError(email, emailErr, "");
  }

  function checkPassword() {
    var v = pw.value;
    if (!v) return setError(pw, pwErr, "Enter your password.");
    if (v.length < 8) return setError(pw, pwErr, "Password must be at least 8 characters.");
    return setError(pw, pwErr, "");
  }

  email.addEventListener("blur", function () { if (email.value) checkEmail(); });
  pw.addEventListener("blur", function () { if (pw.value) checkPassword(); });
  email.addEventListener("input", function () { if (emailErr.textContent) checkEmail(); });
  pw.addEventListener("input", function () { if (pwErr.textContent) checkPassword(); });

  toggle.addEventListener("click", function () {
    var show = pw.type === "password";
    pw.type = show ? "text" : "password";
    toggle.textContent = show ? "Hide" : "Show";
    toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
    toggle.setAttribute("aria-pressed", String(show));
  });

  function attempt() {
    status.textContent = "";
    status.className = "status";
    var okEmail = checkEmail();
    var okPw = checkPassword();
    if (!okEmail) { email.focus(); return; }
    if (!okPw) { pw.focus(); return; }

    submit.disabled = true;
    submit.textContent = "Logging in…";
    // Demo only: replace this timeout with a real request to your server.
    setTimeout(function () {
      submit.disabled = false;
      submit.textContent = "Log in";
      status.textContent = "Validation passed. Connect this form to your login API.";
      status.className = "status ok";
    }, 800);
  }

  submit.addEventListener("click", attempt);
  [email, pw].forEach(function (el) {
    el.addEventListener("keydown", function (e) { if (e.key === "Enter") attempt(); });
  });
})();
</script>
</body>
</html>
